name: Test Fixed Checkin (temp)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch fixed script
        run: curl -sSL https://raw.githubusercontent.com/zhchaoxing/cordc-checkin/main/checkin.py -o checkin.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyotp
      - name: Run fixed check-in
        env:
          CC_EMAIL: ${{ secrets.CC_EMAIL }}
          CC_PASSWD: ${{ secrets.CC_PASSWD }}
          CC_SECRET: ${{ secrets.CC_SECRET }}
          CC_HOST: ${{ secrets.CC_HOST }}
        run: python checkin.py
